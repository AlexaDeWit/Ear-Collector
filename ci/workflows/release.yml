name: Release

# Push an annotated tag such as v0.1.0 (or v0.2.0-beta.1) to publish.
# All checks run first; then the packager builds EarCollector-<tag>.zip and
# attaches it to a GitHub Release for the tag.
#
# CurseForge or Wago later: create the project, add its ID to the TOC
# (## X-Curse-Project-ID / ## X-Wago-ID), add CF_API_TOKEN / WAGO_API_TOKEN as
# repository secrets, and pass them in the packager step's env below.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: [checks]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for the generated changelog
          persist-credentials: false

      - name: Fetch annotated tags
        run: git fetch --tags --force

      - name: Package and publish
        uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2.7.0
        with:
          pandoc: false
        env:
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
